version: '3.8'

services:
  sentra_db:
    image: postgres:15
    container_name: sentra_db
    environment:
      POSTGRES_DB: sentra_os
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  sentra_assessment_engine:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: sentra_assessment_engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentra:sentra123@sentra_db:5432/sentra_os
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - sentra_db
    volumes:
      - ./app:/app
      - ./output:/app/output
      - ./app/templates:/app/templates
      - ./app/seed:/app/seed
    restart: unless-stopped

volumes:
  pgdata:
